{% extends "base.html" %}
{% block title %}Sign In — NeuroVoice AI{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="19" stroke="url(#lg)" stroke-width="2" />
                    <path d="M10 22 Q15 12 20 20 Q25 28 30 18" stroke="url(#lg)" stroke-width="2.5"
                        stroke-linecap="round" fill="none" />
                    <defs>
                        <linearGradient id="lg" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#00C6A2" />
                            <stop offset="100%" stop-color="#4F8EF7" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your screening history</p>

        <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                        <polyline points="22,6 12,13 2,6" />
                    </svg>
                    <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com"
                        required autocomplete="email" value="{{ request.form.get('email', '') }}">
                </div>
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="password">Password</label>
                </div>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••"
                        required autocomplete="current-password">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility"
                        data-target="password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-row-check">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" id="remember" class="checkbox">
                    <span class="checkmark"></span>
                    Remember me for 7 days
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="loginSubmitBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
                Sign In
            </button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <a href="{{ url_for('auth.guest') }}" class="btn btn-ghost btn-full" id="guestLoginBtn">
            Continue without account
        </a>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" id="goToRegisterLink">Create one free</a>
        </p>
    </div>
</div>
{% endblock %}
